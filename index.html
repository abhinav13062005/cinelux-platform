<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090807"><title>Cinelux | Ruff and Tuff Kanya</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--gold:#d7b45b;--bg:#090807;--panel:#15130f;--muted:#a59d8d;--line:#3a3020}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f6f0e5;font:16px system-ui,Arial}header{padding:26px 18px 18px;text-align:center;border-bottom:1px solid var(--line)}.brand{color:var(--gold);letter-spacing:.2em;font: bold 14px Georgia}.hero{max-width:720px;margin:22px auto;padding:0 16px}.poster{min-height:260px;border:2px solid var(--gold);border-radius:22px;background:radial-gradient(circle at 20% 20%,#a21c32,transparent 45%),linear-gradient(135deg,#240717,#790f20 60%,#16070c);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:32px}.poster h1{font:clamp(38px,9vw,68px) Georgia;color:#ffcb48;margin:0}.poster p{font:26px Georgia;margin:8px 0}.date{color:#fff;background:#080706;padding:14px;width:100%;text-align:center;font-weight:700;letter-spacing:.08em;margin-top:28px;border-radius:8px}.tabs{display:flex;gap:8px;max-width:720px;margin:18px auto;padding:0 16px}.tab{flex:1;background:transparent;border:1px solid var(--gold);color:var(--gold);padding:13px;border-radius:12px;font-weight:700}.tab.active{background:var(--gold);color:#100d07}.wrap{max-width:720px;margin:0 auto;padding:0 16px 40px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin:14px 0}.panel h2{margin:0 0 16px;color:var(--gold);font:26px Georgia}label{display:block;color:#c9bfad;margin:12px 0 6px}input,select{width:100%;padding:14px;background:#0d0b08;color:white;border:1px solid #55472d;border-radius:10px;font-size:16px}button{cursor:pointer}.primary{width:100%;padding:15px;border:0;border-radius:12px;background:var(--gold);color:#100d07;font-weight:800;font-size:17px;margin-top:18px}.secondary{padding:12px 15px;border:1px solid var(--gold);border-radius:10px;background:transparent;color:var(--gold);font-weight:700}.status{padding:12px;border-radius:10px;background:#211d15;color:#e9d9b3;margin-top:12px;white-space:pre-wrap}.hidden{display:none!important}.ticket{background:#fff;color:#17130d;border-radius:16px;padding:18px;margin-top:18px;text-align:center}.ticket h3{font:26px Georgia;margin:5px}.ticket small{display:block;color:#645b4c}.ticket strong{font-size:20px}.qr{display:flex;justify-content:center;margin:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:480px){.grid{grid-template-columns:1fr}.panel{padding:16px}}video{width:100%;border-radius:12px;background:#000;margin-top:12px}
</style></head><body>
<header><div class="brand">CINELUX TICKETING</div></header>
<section class="hero"><div class="poster"><h1>RUFF & TUFF</h1><p>KANYA</p><div class="date">26 NOVEMBER 2026 &nbsp; | &nbsp; 5:00 PM</div></div></section>
<nav class="tabs"><button class="tab active" data-tab="book">Generate Ticket</button><button class="tab" data-tab="gate">Gate Scanner</button><button class="tab" data-tab="manage">Ticket Records</button></nav>
<main class="wrap">
<section id="book" class="panel"><h2>Issue a ticket</h2><label>Staff PIN</label><input id="pin" type="password" placeholder="Enter staff PIN" autocomplete="current-password"><div class="grid"><div><label>Client name</label><input id="name" maxlength="60" placeholder="Full name"></div><div><label>WhatsApp number</label><input id="phone" inputmode="numeric" maxlength="10" placeholder="10 digits"></div></div><div class="grid"><div><label>Seat / Booking ID</label><input id="seat" placeholder="e.g. A12"></div><div><label>Number of members</label><input id="members" type="number" min="1" max="20" value="1"></div></div><button class="primary" id="generate">GENERATE TICKET</button><div id="bookmsg" class="status hidden"></div><div id="ticket" class="ticket hidden"><small>RUFF AND TUFF KANYA · ADMIT</small><h3 id="tname"></h3><p id="tseat"></p><strong id="tcode"></strong><div class="qr" id="qr"></div><small>26 November 2026 · 5:00 PM</small><button class="secondary" id="print">Print ticket</button></div></section>
<section id="gate" class="panel hidden"><h2>Gate scanner</h2><label>Staff PIN</label><input id="scanpin" type="password" placeholder="Enter staff PIN"><button class="primary" id="startcam">START CAMERA SCANNER</button><video id="video" class="hidden" playsinline></video><label>Or enter / scan ticket code manually</label><input id="code" placeholder="XXXXXXX-XXXXXXX"><button class="primary" id="verify">VERIFY & CHECK IN</button><div id="scanmsg" class="status hidden"></div></section>
<section id="manage" class="panel hidden"><h2>Ticket records</h2><label>Staff PIN</label><input id="listpin" type="password" placeholder="Enter staff PIN"><button class="primary" id="load">LOAD TICKETS</button><button class="secondary" id="export">DOWNLOAD EXCEL CSV</button><div id="records" class="status">Records are stored online.</div></section>
</main>
<script>
const $=id=>document.getElementById(id);let stream=null,detector=null,scanLoop=false,cached=[];
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));["book","gate","manage"].forEach(id=>$(id).classList.toggle("hidden",id!==b.dataset.tab));stopCamera()}));
function message(id,msg,ok=false){$(id).textContent=msg;$(id).classList.remove("hidden");$(id).style.color=ok?"#a7e6b7":"#ffd1bd"}
async function api(op,extra={}){const r=await fetch("/api",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({op,...extra})});let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.error||"Request failed ("+r.status+")");return j}
$("generate").onclick=async()=>{const pin=$("pin").value.trim();if(!pin)return message("bookmsg","Enter staff PIN.");$("generate").disabled=true;$("generate").textContent="GENERATING…";try{const {ticket}=await api("create",{pin,name:$("name").value,phone:$("phone").value,seat:$("seat").value,members:$("members").value});$("tname").textContent=ticket.name;$("tseat").textContent="Seat: "+ticket.seat+" · Members: "+ticket.members;$("tcode").textContent=ticket.code;$("qr").innerHTML="";if(window.QRCode)new QRCode($("qr"),{text:ticket.code,width:180,height:180});$("ticket").classList.remove("hidden");message("bookmsg","Ticket generated and saved online.",true)}catch(e){message("bookmsg",e.message)}finally{$("generate").disabled=false;$("generate").textContent="GENERATE TICKET"}};
$("print").onclick=()=>window.print();
$("verify").onclick=async()=>{try{const j=await api("checkin",{pin:$("scanpin").value,code:$("code").value});if(j.status==="ok")message("scanmsg","SCANNED ✓\n"+j.ticket.name+" · "+j.ticket.seat,true);else if(j.status==="used")message("scanmsg","ALREADY SCANNED ✕\n"+j.ticket.name+" · "+j.ticket.seat+"\nPrevious scan: "+new Date(j.ticket.usedAt).toLocaleString());else message("scanmsg",j.status==="wrong"?"WRONG EVENT / DATE":"INVALID TICKET") }catch(e){message("scanmsg",e.message)}};
$("startcam").onclick=async()=>{try{if(!("BarcodeDetector"in window))throw Error("Camera QR detection is not supported in this browser. Use manual code entry.");detector=new BarcodeDetector({formats:["qr_code"]});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});$("video").srcObject=stream;$("video").classList.remove("hidden");await $("video").play();scanLoop=true;cameraTick()}catch(e){message("scanmsg",e.message)}};
async function cameraTick(){if(!scanLoop||!detector)return;try{const codes=await detector.detect($("video"));if(codes.length){$("code").value=codes[0].rawValue;stopCamera();$("verify").click();return}}catch{}requestAnimationFrame(cameraTick)}
function stopCamera(){scanLoop=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}if($("video"))$("video").classList.add("hidden")}
$("load").onclick=async()=>{try{const j=await api("list",{pin:$("listpin").value});cached=j.tickets||[];$("records").textContent=cached.length?cached.map(t=>t.code+" | "+t.name+" | "+t.seat+" | "+(t.usedAt?"SCANNED":"VALID")).join("\n"):"No tickets yet."}catch(e){message("records",e.message)}};
$("export").onclick=()=>{if(!cached.length)return message("records","Load ticket records first.");const cols=["Ticket Code","Client Name","WhatsApp Number","Seat","Members","Movie","Date","Time","Ticket Status","Scanned At","Issued At"];const rows=cached.map(t=>[t.code,t.name,t.phone,t.seat,t.members,t.movie,t.date,t.time,t.usedAt?"SCANNED":"VALID",t.usedAt?new Date(t.usedAt).toLocaleString():"",new Date(t.issuedAt).toLocaleString()]);const csv="\uFEFF"+[cols,...rows].map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="Ruff-and-Tuff-Kanya-Tickets.csv";a.click();URL.revokeObjectURL(a.href)};
window.addEventListener("beforeunload",stopCamera);
</script></body></html>
